# nginx in front of two Aran Cloud instances (docker compose --profile ha). Mounted as /etc/nginx/conf.d/default.conf.
#
# - cloud and cloud2 share one Postgres. Either can answer any request; sweepers are guarded by a lease in the database.
# - Per-tenant host names: <route>.<tenant-slug>.fw.aran.local reaches the same Cloud, which serves it as /fw/<route>/...
#   The caller still sends its Aran key: the key decides the tenant, the slug in the host name is only a check.
#   For a local test add the name to /etc/hosts, or send a Host header with curl.
# - mTLS: the 8443 listener asks for a client certificate and passes its fingerprint to Cloud in X-Client-Cert-Fingerprint.
#   Cloud believes that header only from a peer listed in ARAN_TRUSTED_PROXIES (this nginx), and only for routes that
#   set require_client_cert with the allowed fingerprints. Make test certificates with deploy/nginx/make-certs.sh.

upstream aran_cloud {
    server cloud:8100 max_fails=2 fail_timeout=5s;
    server cloud2:8100 max_fails=2 fail_timeout=5s;
    keepalive 16;
}

# Plain HTTP: the API, the dashboard and *.fw.aran.local
server {
    listen 80;
    server_name aran.local *.fw.aran.local _;

    client_max_body_size 2m;           # Cloud refuses a body over 1 MB itself, with a clear message

    location / {
        proxy_pass http://aran_cloud;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Fingerprint "";     # never pass one a client typed in
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}

# mTLS: callers must present a certificate signed by clients-ca.crt
server {
    listen 8443 ssl;
    server_name aran.local *.fw.aran.local _;

    ssl_certificate         /etc/nginx/certs/server.crt;
    ssl_certificate_key     /etc/nginx/certs/server.key;
    ssl_client_certificate  /etc/nginx/certs/clients-ca.crt;
    ssl_verify_client       on;
    ssl_protocols           TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    location / {
        proxy_pass http://aran_cloud;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Client-Cert-Fingerprint $ssl_client_fingerprint;   # SHA-1 of the verified client certificate
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}
