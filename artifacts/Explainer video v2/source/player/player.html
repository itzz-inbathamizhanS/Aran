<!doctype html>
<html><head><meta charset="utf-8"><title>Aran explainer</title>
<style>
html,body{margin:0;padding:0;background:#F3EEE4;overflow:hidden}
#wrap{position:relative;width:1920px;height:1080px;background:#F3EEE4}
svg{position:absolute;inset:0}
.an{transform-box:fill-box;transform-origin:center}
#sub{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;opacity:0}
#subtxt{max-width:1600px;background:rgba(251,248,241,.95);color:#1F2933;font:500 36px/1.34 Inter,'Noto Sans Tamil','Noto Sans Devanagari',sans-serif;padding:12px 30px;border-radius:12px;text-align:center;border:2px solid #CDBFA9;box-shadow:5px 5px 0 #D9CCB6}
</style></head>
<body><div id="wrap">
<svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<div id="sub"><div id="subtxt"></div></div>
</div>
<script src="../timing.js"></script>
<script src="../data.js"></script>
<script src="engine.js"></script>
<script>
// load one file per scene: ../scenes/<id>.js (missing files fall back to a title card)
const ids = window.TIMING.scenes.map(s => s.id);
Promise.all(ids.map(id => new Promise(res => { const s = document.createElement('script'); s.src = '../scenes/' + id + '.js'; s.onload = res; s.onerror = res; document.body.appendChild(s); })))
  .then(() => document.fonts.ready)
  .then(() => Promise.all([document.fonts.load('600 40px Fraunces'), document.fonts.load('500 30px Inter'), document.fonts.load('600 30px "DejaVu Sans Mono"')]))
  .then(() => { init(); seek(0); window.READY = true; });
</script>
</body></html>
